# =============================================================================
# /etc/ssh/sshd_config.d/10-ut3-seguridad.conf
# UT3 · Servicios de acceso remoto · Ejercicio 13 (página 03-ssh.md)
# Servidor: ubuntuserver24 · Ubuntu Server 24.04 LTS · 172.16.2.1
#
# Por qué un fichero aparte y no editar /etc/ssh/sshd_config:
#   - sshd_config empieza con «Include /etc/ssh/sshd_config.d/*.conf».
#   - En OpenSSH, para cada directiva VALE EL PRIMER VALOR QUE SE LEE.
#   - Los ficheros de sshd_config.d/ se leen en orden alfabético, así que
#     «10-…» se lee antes que, por ejemplo, «50-cloud-init.conf», y sus
#     valores ganan a los de ese fichero y a los del propio sshd_config.
#   - Las actualizaciones del paquete no tocan este fichero.
#
# Antes de aplicar:   sudo sshd -t                 (si no dice nada, está bien)
# Aplicar:            sudo systemctl restart ssh
# Ver lo efectivo:    sudo sshd -T | grep -Ei 'permitroot|maxauth|password|banner'
#
# Este fichero NO cambia Port ni ListenAddress. Si se cambiaran, en Ubuntu 24.04
# habría que hacer además: sudo systemctl daemon-reload && sudo systemctl restart ssh.socket
# =============================================================================

# root no puede iniciar sesión por SSH de ninguna forma (ni con contraseña ni con clave).
# Se entra con un usuario normal y se usa sudo. El valor por defecto es
# «prohibit-password» (root solo con clave pública).
PermitRootLogin no

# Número máximo de intentos de autenticación en una misma conexión.
# Por defecto son 6. Con 3 se frenan los ataques de fuerza bruta.
MaxAuthTries 3

# Tiempo máximo para completar el inicio de sesión. Si el usuario no se ha
# autenticado en 30 segundos, se corta la conexión. Por defecto, 2 minutos.
LoginGraceTime 30s

# Permite la autenticación con clave pública (ejercicio 12). Ya es el valor por
# defecto; se escribe para que quede claro en la configuración del laboratorio.
PubkeyAuthentication yes

# Permite la autenticación con contraseña. Se deja en «yes» porque el cliente
# Windows 7 entra con contraseña desde PuTTY (ejercicio 15).
# En la ampliación se cambia a «no» cuando todos los clientes usan claves.
PasswordAuthentication yes

# Permite el reenvío X11 (ejercicio 14: ssh -X). Necesita el paquete xauth
# en el servidor. Ubuntu ya lo trae activado en sshd_config.
X11Forwarding yes

# Texto que se muestra ANTES de pedir la contraseña (aviso legal).
# El fichero se crea con:
#   echo "Acceso restringido al laboratorio de SMR. Toda la actividad queda registrada." | sudo tee /etc/issue.net
Banner /etc/issue.net
