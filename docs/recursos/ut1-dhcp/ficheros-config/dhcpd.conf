# =====================================================================
#  dhcpd.conf — Configuración de ejemplo del servidor DHCP (isc-dhcp-server)
#  Módulo: Servicios en Red · 2º SMR · UT1 DHCP · Práctica UT1-P2
#  Ruta en el servidor:  /etc/dhcp/dhcpd.conf
#  Ruta en el repo:      recursos/ut1-dhcp/ficheros-config/dhcpd.conf
#
#  Escenario (red interna net02, 172.16.2.0/24):
#    - Servidor DHCP ubuntuserver24 ..... 172.16.2.1   (IP estática)
#      (Ubuntu Server 24.04 LTS)
#    - Router Debian 12 (gateway) ....... 172.16.2.254
#    - Cliente Windows 7 ................ dinámico, 172.16.2.101 – .200
#    - Cliente Debian 12 ................ reserva, 172.16.2.50
#
#  Tras editar:  sudo dhcpd -t -cf /etc/dhcp/dhcpd.conf   (comprueba la sintaxis)
#                sudo systemctl restart isc-dhcp-server
#
#  NOTA: isc-dhcp-server ya no recibe mantenimiento de ISC (fin de vida en
#  2022). La alternativa actual es Kea (paquete kea-dhcp4-server). En esta
#  práctica se usa isc-dhcp-server por su sencillez didáctica.
# =====================================================================

# ---------------------------------------------------------------------
# 1. OPCIONES GLOBALES (se aplican a todas las subredes, salvo que una
#    subred las redefina)
# ---------------------------------------------------------------------

# Nombre de dominio DNS que se entrega a los clientes (opción DHCP 15).
option domain-name "smr2ser.org";

# Servidores DNS que usarán los clientes (opción DHCP 6), separados por comas y
# en orden de preferencia: primero el primario y después el secundario.
# Son los DNS de la red Educacyl del aula. Se ponen por IP y no por nombre:
# con un nombre (p. ej. "educacyl"), el servidor tiene que poder resolverlo al
# arrancar; si no puede, no arranca.
# En la UT2 pondremos delante la IP de nuestro propio servidor DNS.
option domain-name-servers 10.151.123.21, 10.151.126.21;

# Duración de la concesión, en segundos, si el cliente no pide otra: 1 día.
default-lease-time 86400;

# Duración máxima que se concede aunque el cliente pida más: 8 días.
max-lease-time 691200;

# Duración mínima de la concesión: 1 hora.
min-lease-time 3600;

# Actualización dinámica de DNS desactivada. Viene así en el fichero por
# defecto de Ubuntu y la usaremos (o no) en la UT2.
ddns-update-style none;

# Este servidor es la autoridad DHCP de la red: si un cliente pide una IP que
# no corresponde a esta red, le responde con DHCPNAK para que empiece de nuevo
# el proceso DORA, en lugar de ignorarlo.
authoritative;

# ---------------------------------------------------------------------
# 2. DECLARACIÓN DE LA SUBRED (equivale al «ámbito» de Windows Server)
#    Tiene que coincidir con la red de la interfaz indicada en
#    /etc/default/isc-dhcp-server (INTERFACESv4). Si no, el servicio no arranca.
# ---------------------------------------------------------------------

# Dirección de red y máscara de la subred que atiende el servidor.
subnet 172.16.2.0 netmask 255.255.255.0 {

    # Puerta de enlace (router) que se entrega a los clientes (opción DHCP 3).
    option routers 172.16.2.254;

    # Máscara de subred para los clientes (opción DHCP 1). Es redundante
    # porque se toma del «netmask» de arriba, pero así queda explícita.
    option subnet-mask 255.255.255.0;

    # Dirección de difusión (broadcast) de la subred (opción DHCP 28).
    option broadcast-address 172.16.2.255;

    # Rango de IP que se reparten dinámicamente (en Windows, «intervalo»).
    # Lo que queda fuera del rango (.2 – .100 y .201 – .253) no se reparte
    # dinámicamente, así que no hacen falta exclusiones.
    range 172.16.2.101 172.16.2.200;
}

# ---------------------------------------------------------------------
# 3. ASIGNACIÓN ESTÁTICA — RESERVA (en Windows, «Reserva»)
#    Puede ir dentro o fuera del bloque subnet. La IP fija NO debe estar
#    dentro de ningún «range», para que no se reparta también dinámicamente.
# ---------------------------------------------------------------------

# Nombre interno de la reserva (solo lo usa el servidor, no es el hostname).
host cliente-debian {

    # MAC de la tarjeta del cliente Debian. Esta es FICTICIA: sustitúyela por
    # la real (en el cliente: ip link, línea «link/ether»).
    hardware ethernet 08:00:27:aa:bb:cc;

    # IP que recibirá siempre este cliente.
    fixed-address 172.16.2.50;

    # (Opcional) Nombre de host que se entrega al cliente (opción DHCP 12).
    option host-name "cliente-debian";
}

# ---------------------------------------------------------------------
# IMPORTANTE para la verificación:
#  - Las concesiones dinámicas (cliente Windows 7) se guardan en
#    /var/lib/dhcp/dhcpd.leases.
#  - Las reservas con fixed-address NO se guardan en dhcpd.leases. Para
#    comprobar que el cliente Debian ha recibido su IP, mira el registro:
#       journalctl -u isc-dhcp-server | grep -E "DHCP(OFFER|ACK)"
#    Debe aparecer:  DHCPACK on 172.16.2.50 to 08:00:27:aa:bb:cc ...
# ---------------------------------------------------------------------
